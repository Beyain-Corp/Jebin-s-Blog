name: Sync Notion Articles

on:
  schedule:
    # GitHub Actions hard minimum is 5 minutes (intervals < 5m are throttled by GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual run button in GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Notion Sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node scripts/sync-notion.mjs

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ static/media/ src/data/ public/media/
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "chore(notion): sync latest articles and images from Notion"
            git push
          fi